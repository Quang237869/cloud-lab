services:
  backend:
    image: nguyenquang2107/mern-backend:1.0
    container_name: mern-backend
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "5000:5000"

  frontend:
    image: nguyenquang2107/mern-frontend:1.0
    container_name: mern-frontend
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend
      
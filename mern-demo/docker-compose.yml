services:
  backend:
    build:
      context: .
      dockerfile: server/Dockerfile
    container_name: mern-backend
    environment:
      PORT: 5000
      MONGODB_URI: ${MONGODB_URI}
    ports:
      - "5000:5000"

  frontend:
    build: ./client
    container_name: mern-frontend
    ports:
      - "3000:80"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - backend